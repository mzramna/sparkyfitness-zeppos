name: ci
on:
  push:
    branches: [main]
  pull_request:

# Cancela execuções antigas do mesmo PR/branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # testes, i18n estrito e cobertura mínima por arquivo (scripts/test.mjs)
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Bundle check (imports e sintaxe)
        run: npx esbuild app.js page/*.js app-side/index.js app-service/*.js setting/index.js --bundle --format=esm --outdir=/tmp/esb --external:@zos/* --log-level=warning
      - run: npm i -g @zeppos/zeus-cli@1.9.3
      - name: Pre-compilation verify (all API profiles)
        run: npm run verify
      - name: Build all API profiles (1.0, 3.0, 3.6, 4.0)
        env: { CI: '1' }
        run: npm run build:all
      - name: Pacotes gerados
        run: ls -la dist && test -n "$(find dist -name '*.zab' -print -quit)"
      - name: Pacote inclui o Amazfit Balance
        run: python3 -I scripts/check_zab.py dist/sparkyfitness-api3.6.zab
      - uses: actions/upload-artifact@v5
        with:
          name: sparkyfitness-zeppos-${{ github.sha }}
          path: dist/*.zab
          retention-days: 14
          if-no-files-found: error
